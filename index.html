<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cute Proposal</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Georgia,serif;
    background:linear-gradient(180deg,#ffb300,#ff7a00);
    color:white;
}

.page{
    text-align:center;
    padding-top:120px;
}

h1{
    font-size:3rem;
}

.btn{
    padding:16px 38px;
    border:none;
    border-radius:40px;
    font-size:24px;
    cursor:pointer;
}

#yes{
    background:#ff1493;
    color:#fff;
}

#no{
    background:#f0c36d;
    color:#fff;
    position:absolute;
}

#msg{
    margin-top:70px;
    font-size:22px;
}

.heart{
    position:absolute;
    font-size:28px;
    animation:rise 8s linear infinite;
}

@keyframes rise{
    from{transform:translateY(100vh);}
    to{transform:translateY(-120px);}
}

#celebrate{
    display:none;
    height:100vh;
    text-align:center;
    padding-top:80px;
}

img{
    max-width:320px;
    border-radius:25px;
    box-shadow:0 0 30px hotpink;
}
</style>
</head>

<body>

<!-- MAIN PAGE -->
<div id="main" class="page">

    <h1>Joshitha, will you be mine forever? 💖</h1>

    <h2>From: Karthik 💌</h2>

    <button id="yes" class="btn">Yes 💕</button>

    <button id="no" class="btn">No 😉</button>

    <div id="msg">Try pressing No 😜</div>

    <audio id="bgMusic" autoplay loop>
        <source src="I_Wanna_Be_Yours.mp3" type="audio/mpeg">
    </audio>

</div>

<!-- YES PAGE -->
<div id="celebrate">

    <h1>Yay! I knew you'd say YES! ❤️</h1>

    <p>
        You're the most beautiful person i know.💖
    </p>

    <img src="https://media.tenor.com/0AVbKGY_MxMAAAAC/cat-kiss.gif" alt="Cute Cat">
</div>

<script>

const msgs = [
"Nice try 😜",
"Destiny says YES 💖",
"The button escaped!",
"You know you want to press YES 🥺",
"Error 404: No button missing",
"The universe ships us ❤️",
"No is unavailable today 😆"
];

let used = [];

function nextMsg(){

    if(used.length === msgs.length){
        used = [];
    }

    let i;

    do{
        i = Math.floor(Math.random() * msgs.length);
    }while(used.includes(i));

    used.push(i);

    document.getElementById("msg").innerText = msgs[i];
}

const no = document.getElementById("no");

function move(){

    no.style.left =
        Math.random() * (window.innerWidth - 180) + "px";

    no.style.top =
        Math.random() * (window.innerHeight - 80) + "px";

    nextMsg();
}

no.addEventListener("mouseover", move);
no.addEventListener("click", move);

document.getElementById("yes").addEventListener("click", () => {

    document.getElementById("main").style.display = "none";

    document.getElementById("celebrate").style.display = "block";
});

for(let i = 0; i < 25; i++){

    let h = document.createElement("div");

    h.className = "heart";

    h.innerHTML = "💖";

    h.style.left = Math.random() * 100 + "vw";

    h.style.animationDelay = Math.random() * 8 + "s";

    document.body.appendChild(h);
}

</script>

</body>
</html>
